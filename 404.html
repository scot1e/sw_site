<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | SCOTT WORK</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Raleway', sans-serif;
            background-color: #000;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        .error-section {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        .error-bg-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            font-family: 'Raleway', sans-serif;
            animation: bgGlitch 8s infinite;
            letter-spacing: 20px;
        }
        
        .error-bg-number::before,
        .error-bg-number::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.3;
        }
        
        .error-bg-number::before {
            animation: bgGlitchTop 6s infinite linear alternate-reverse;
            color: rgba(255, 0, 0, 0.1);
            z-index: -1;
        }
        
        .error-bg-number::after {
            animation: bgGlitchBottom 5s infinite linear alternate-reverse;
            color: rgba(0, 0, 255, 0.1);
            z-index: -2;
        }
        
        .error-content {
            position: relative;
            z-index: 3;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .error-code {
            font-size: 0;
            height: 0;
            opacity: 0;
        }
        
        .error-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.95;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        
        .error-text {
            font-size: 1.2rem;
            color: white;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            max-width: 400px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            opacity: 0.9;
        }
        
        .error-button {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 1rem 3rem;
            border: 2px solid white;
            background: transparent;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .error-button:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }
        
        @keyframes bgGlitch {
            0%, 100% { transform: translate(-50%, -50%) skew(0deg); }
            95% { transform: translate(-50%, -50%) skew(0deg); }
            96% { transform: translate(-50%, -50%) skew(10deg); }
            97% { transform: translate(-50%, -50%) skew(-10deg); }
            98% { transform: translate(-50%, -50%) skew(0deg); }
        }
        
        @keyframes bgGlitchTop {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-20px, -20px); }
            40% { transform: translate(20px, 20px); }
            60% { transform: translate(-20px, 20px); }
            80% { transform: translate(20px, -20px); }
            100% { transform: translate(0, 0); }
        }
        
        @keyframes bgGlitchBottom {
            0% { transform: translate(0, 0); }
            20% { transform: translate(20px, 20px); }
            40% { transform: translate(-20px, -20px); }
            60% { transform: translate(20px, -20px); }
            80% { transform: translate(-20px, 20px); }
            100% { transform: translate(0, 0); }
        }
        
        @media screen and (max-width: 768px) {
            .error-title { font-size: 2rem; }
            .error-text { font-size: 1rem; }
            .error-button { font-size: 1rem; padding: 0.8rem 2rem; }
            .error-bg-number { font-size: 60vw; }
        }
        
        @media screen and (max-width: 480px) {
            .error-title { font-size: 1.5rem; letter-spacing: 3px; }
            .error-content { padding: 1rem; width: 90%; }
        }
    </style>
</head>
<body>
    <section class="error-section">
        <div class="error-bg-number" data-text="404">404</div>
        
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">ПУСТОТА</h1>
            <p class="error-text">
                Здесь ничего нет.<br>
                Возвращайся обратно.
            </p>
            <a href="index.html" class="error-button">НА ГЛАВНУЮ</a>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const bgNumber = document.querySelector('.error-bg-number');
            if (bgNumber) {
                setInterval(() => {
                    bgNumber.style.animation = 'none';
                    setTimeout(() => {
                        bgNumber.style.animation = 'bgGlitch 8s infinite';
                    }, 50);
                }, 10000);
            }
        });
    </script>
</body>
</html>
